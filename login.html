<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HealthMate</title>
  <style>
    body {
      background: linear-gradient(to right, #87CEEB, #ADD8E6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: green;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: darkgreen;
    }
    .footer {
      margin-top: 10px;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to HealthMate</h1>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button onclick="window.location.href='home.html'">Login</button>
    <div class="footer">New? Sign up</div>
  </div>
</body>
</html>
